name: pillo_poncho
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icono.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/aguila.jpeg
    - assets/icono.jpeg
    - assets/sello.jpeg